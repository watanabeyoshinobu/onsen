version: 2.1 # バージョン指定

orbs:
  aws-ecr: circleci/aws-ecr@9.0
  aws-ecs: circleci/aws-ecs@2.2.1
  aws-cli: circleci/aws-cli@5.1

workflows:
  build-and-deploy: # Nginxのデプロイ
    jobs:
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup:
                # role_arn: arn:aws:iam::123456789012:role/VALID_OIDC_ECR_ROLE ロールが必要
          # aws-region: AWS_DEFAULT_REGION
          # aws-access-key-id: AWS_ACCESS_KEY_ID
          # aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          create-repo: true
          dockerfile: ./docker/nginx/Dockerfile
          repo: onsen-nginx
          tag: "latest"
          filters:
            branches:
              only: master
      - aws-ecs/deploy-service-update:
          requires:
            - aws-ecr/build_and_push_image
          family: "onsen-task" # ECSのタスク定義名
          cluster: "arn:aws:ecs:ap-northeast-1:275335316117:cluster/onsen-cluster" #ECSのクラスターのARN
          service-name: "onsen-service" #サービス名
          container-image-name-updates: "container=onsen-nginx-container,tag=latest" #ECSのタスク定義内のコンテナ名
 
  rails-deploy: # Railsのデプロイ
    jobs:
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup:
                # role_arn: arn:aws:iam::123456789012:role/VALID_OIDC_ECR_ROLE ロールが必要
          # region: AWS_REGION
          # aws-access-key-id: AWS_ACCESS_KEY_ID
          # aws-secret-access-key: AWS_SECRET_ACCESS_KEY
          create-repo: true
          dockerfile: ./docker/rails/Dockerfile
          repo: onsen
          tag: "latest"
          filters:
            branches:
              only: master
      - aws-ecs/deploy-service-update:
          requires:
            - aws-ecr/build_and_push_image
          family: "onsen-task" # ECSのタスク定義名
          cluster-name: "arn:aws:ecs:ap-northeast-1:275335316117:cluster/onsen-cluster" #ECSのクラスターのARN
          service-name: "onsen-service" #サービス名
          container-image-name-updates: "container=onsen-container,tag=latest" #ECSのタスク定義内のコンテナ名