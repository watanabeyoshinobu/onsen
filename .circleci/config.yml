workflows:
  build_and_deploy_all:
    jobs:
      # 1. Nginxイメージのビルドとプッシュ
      - aws-ecr/build_and_push_image:
          name: build_nginx_image
          dockerfile: ./docker/nginx/Dockerfile
          repo: onsen-nginx-tf
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master
          auth: 
            - aws-cli/setup

      # 2. Railsイメージのビルドとプッシュ
      - aws-ecr/build_and_push_image:
          name: build_rails_image
          dockerfile: ./docker/rails/Dockerfile
          repo: onsen-rails-tf
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master
          auth:    
            - aws-cli/setup

      # 3. DBマイグレーション（一旦コメントアウトしてスキップ）
      # - db_migrate:
      #     requires:
      #       - build_nginx_image
      #       - build_rails_image

      # 4. ECSサービスへのデプロイ
      - aws-ecs/deploy-service-update:
          requires:
            - build_nginx_image
            - build_rails_image
            # - db_migrate      # コメントアウト
          family: "onsen-task-tf"       # ←★変更！ (タスク定義名)
          cluster-name: "onsen-cluster-tf" # ←★変更！ (クラスター名)
          service-name: "onsen-service"    # (これはそのまま)
          container-image-name-updates: |
            container=onsen-nginx-container,tag=${CIRCLE_SHA1}
            container=onsen-container,tag=${CIRCLE_SHA1}