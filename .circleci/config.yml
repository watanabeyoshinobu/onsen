version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@9.6.0 
  aws-ecs: circleci/aws-ecs@7.1.0
  aws-cli: circleci/aws-cli@5.3.1

jobs:
  db_migrate:
    docker:
      - image: cimg/aws/client:latest
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Run DB Migrations
          command: |
            aws ecs run-task --cluster onsen-cluster --task-definition onsen-task \
            --launch-type EC2 \
            --overrides '{"containerOverrides": [{"name": "onsen-container", "command": ["rails", "db:migrate"]}]}'

workflows:
  build_and_deploy_all:
    jobs:
      # 1. Nginxイメージのビルドとプッシュ
      - aws-ecr/build_and_push_image:
          create-repo: true
          dockerfile: ./docker/nginx/Dockerfile
          repo: onsen-nginx
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master
          auth:
            - aws-cli/setup

      # 2. Railsイメージのビルドとプッシュ
      - aws-ecr/build_and_push_image:
          create-repo: true
          dockerfile: ./docker/rails/Dockerfile
          repo: onsen
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master
          auth:
            - aws-cli/setup
      
      # 3. データベースマイグレーションの実行
      - db_migrate:
          requires:
            - aws-ecr/build_and_push_image 

      # 4. ECSサービスへのデプロイ（更新）
      - aws-ecs/deploy-service-update:
          requires:
            - db_migrate
          family: "onsen-task" 
          cluster: "onsen-cluster" 
          service-name: "onsen-service"
          container-image-configs: |
            - ecr-repo: onsen-nginx
              container-name: onsen-nginx-container
              tag: ${CIRCLE_SHA1}
            - ecr-repo: onsen
              container-name: onsen-container
              tag: ${CIRCLE_SHA1}