version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@9.0.0
  aws-ecs: circleci/aws-ecs@4.0.0
  aws-cli: circleci/aws-cli@4.0.0

workflows:
  build_and_deploy_all:
    jobs:
      # 1. Nginxイメージのビルドとプッシュ
      - aws-ecr/build-and-push-image:
          name: build_nginx_image
          dockerfile: Dockerfile
          path: ./docker/nginx
          repo: onsen-nginx-tf
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master

      # 2. Railsイメージのビルドとプッシュ
      - aws-ecr/build-and-push-image:
          name: build_rails_image
          dockerfile: ./docker/rails/Dockerfile
          path: .
          repo: onsen-rails-tf
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master

      # 3. ECSサービスへのデプロイ（イメージ入れ替え）
      - aws-ecs/deploy-service-update:
          requires:
            - build_nginx_image
            - build_rails_image
          family: "onsen-task-tf"
          cluster: "onsen-cluster-tf"
          service-name: "onsen-service"
          container-image-name-updates: "container=onsen-nginx-container,tag=${CIRCLE_SHA1},container=onsen-container,tag=${CIRCLE_SHA1}"
          filters:
            branches:
              only: master