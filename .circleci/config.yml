version: 2.1

orbs:
  aws-ecr: circleci/aws-ecr@9.7.0
  aws-ecs: circleci/aws-ecs@7.2.0
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  # データベースマイグレーションを実行するカスタムジョブを定義
  db_migrate:
    docker:
      - image: cimg/aws/client:latest # AWS CLIが使えるDockerイメージ
    steps:
      - checkout
      - aws-cli/setup
      - run:
          name: Run DB Migrations
          command: |
            aws ecs run-task --cluster onsen-cluster --task-definition onsen-task \
            --launch-type EC2 \
            --overrides '{"containerOverrides": [{"name": "onsen-container", "command": ["rails", "db:migrate"]}]}'

workflows:
  build_and_deploy_all: # すべてを統合した単一のワークフロー
    jobs:
      # 1. Nginxイメージのビルドとプッシュ
      - aws-ecr/build_and_push_image:
          auth: true # --- 修正 B: auth: true を追加 ---
          create-repo: true
          dockerfile: ./docker/nginx/Dockerfile
          repo: onsen-nginx
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master

      # 2. Railsイメージのビルドとプッシュ
      - aws-ecr/build_and_push_image:
          auth: true # --- 修正 B: auth: true を追加 ---
          create-repo: true
          dockerfile: ./docker/rails/Dockerfile
          repo: onsen
          tag: "${CIRCLE_SHA1}"
          filters:
            branches:
              only: master
      
      # 3. データベースマイグレーションの実行
      - db_migrate:
          requires:
            - aws-ecr/build_and_push_image 

      # 4. ECSサービスへのデプロイ（更新）
      - aws-ecs/deploy-service-update:
          requires:
            - db_migrate # マイグレーション完了を待つ
          family: "onsen-task" 
          cluster: "onsen-cluster" 
          service-name: "onsen-service"
          # --- 修正 A: container-image-updates を新しい形式に変更 ---
          container-image-configs: |
            - ecr-repo: onsen-nginx
              container-name: onsen-nginx-container
              tag: ${CIRCLE_SHA1}
            - ecr-repo: onsen
              container-name: onsen-container
              tag: ${CIRCLE_SHA1}